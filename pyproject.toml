[project]
name = "research-navigator"
version = "0.1.0"
description = "AI Research Navigator: a citation-grounded RAG companion for AI/ML learners."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "qdrant-client>=1.11",
    "typer>=0.12",
    "rich>=13.7",
    "trafilatura>=2.2.0",
]

[project.scripts]
research-navigator = "research_navigator.cli:app"

[dependency-groups]
# uv-native dev dependency group (installed by `uv sync`)
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pre-commit>=3.7",
    "detect-secrets>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_navigator"]

# ---------------------------------------------------------------------------
# Ruff: lint + format
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]
# E/F pyflakes+pycodestyle, I isort, B bugbear, UP pyupgrade,
# SIM simplify, C4 comprehensions, RUF ruff-native.

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # asserts are expected in tests

# ---------------------------------------------------------------------------
# mypy: strict, scoped to src/
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
warn_unreachable = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest + coverage
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not integration' --cov=research_navigator --cov-report=term-missing"
markers = [
    "integration: tests that require a running Qdrant (deselected by default).",
]
